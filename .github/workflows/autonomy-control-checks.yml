name: Autonomy Control Checks
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Candidate checks PR #{0} {1}', inputs.pr_number, inputs.head_sha) || github.event.pull_request.title || github.event.head_commit.message }}"
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatched candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/pr.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/pr.json'))
          assert p['state']=='open' and p['head']['sha']==os.environ['CANDIDATE_SHA']
          assert p['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - run: python -m pip install pytest==8.4.2
      - run: python scripts/run_repo_checks.py

  independent-review:
    # Bot candidates already receive exact-scope independent QA in the trusted
    # executor. This separate lane reviews human-governed control repairs.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Prepare trusted read-only reviewer
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:scripts/perplexity_repo_agent.py > /tmp/trusted-reviewer.py
          cat > /tmp/control-review.md <<'PROMPT'
          Independently review the complete control-plane repair diff with git_diff base=origin/main. Read AGENTS.md and DATA_BOUNDARY.md. This is an explicitly authorized trusted control-plane repair, so protected files may be changed by this PR; bounded coding agents must still be unable to change them. Check fail-closed verdict parsing, mandatory executable tests, bounded remediation, scope preservation, duplicate dispatch, credential isolation, and task-ledger compatibility. No edits or external actions. Return exactly one standalone line VERDICT: PASS or VERDICT: FAIL, followed by evidence and substantive defects. PASS only if the repair is acceptable; never treat missing evidence as acceptance.
          PROMPT
      - name: Independent read-only QA
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python /tmp/trusted-reviewer.py --mode review --prompt-file /tmp/control-review.md --output-file /tmp/control-review.txt --model google/gemini-3.7-flash --max-output-tokens 6000
      - name: Preserve and enforce independent verdict
        run: |
          cat /tmp/control-review.txt
          git show origin/main:scripts/parse_review_verdict.py > /tmp/trusted-verdict.py
          python /tmp/trusted-verdict.py /tmp/control-review.txt > /tmp/verdict
          test "$(cat /tmp/verdict)" = "pass=true"
