name: Jespersen Codex Executor

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing [CODEX] issue number to execute
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: jespersen-codex-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[CODEX]')
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.task.outputs.issue_number }}
      branch_name: ${{ steps.branch.outputs.branch_name }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Resolve task
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          issue="${EVENT_ISSUE:-${INPUT_ISSUE:-}}"
          [[ "$issue" =~ ^[0-9]+$ ]] || { echo "Invalid issue number" >&2; exit 1; }
          echo "issue_number=$issue" >> "$GITHUB_OUTPUT"
          gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,url > /tmp/jespersen-codex-task.json

      - name: Verify trusted trigger actor
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm="$(gh api "/repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')"
          case "$perm" in
            admin|maintain|write) ;;
            *) echo "Trigger actor lacks write permission: $ACTOR ($perm)" >&2; exit 1 ;;
          esac

      - name: Validate public-safe task envelope
        run: python scripts/validate_codex_task.py /tmp/jespersen-codex-task.json

      - name: Require Codex credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY GitHub Actions secret is not configured." >&2
            exit 1
          fi

      - name: Create isolated implementation branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          branch="agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "branch_name=$branch" >> "$GITHUB_OUTPUT"

      - name: Build Codex prompt from task
        env:
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          task = json.loads(pathlib.Path("/tmp/jespersen-codex-task.json").read_text())
          prompt = f"""You are the bounded Product Engineering coding executor for Jespersen Painting Intelligence.

Read PROJECT.md, PRODUCT_SPEC.md, ACCEPTANCE.md, CONSTRAINTS.md, DATA_BOUNDARY.md, AGENTS.md, RUNBOOK.md, STATUS.md, BACKLOG.md, DECISIONS.md, and FOUNDER_ACTIONS.md before changing anything.

Task source: public GitHub issue #{os.environ['ISSUE_NUMBER']}
Title: {task['title']}

Task package:
{task.get('body') or ''}

Hard execution rules:
- Work only inside this checked-out public repository.
- This lane is T0/T1 development work only. Never perform production promotion, money movement, pricing, contracts, auth/permission changes, credential/secret handling, destructive external actions, or external communications.
- Do not use or request real Jespersen customer, employee, payroll, invoice, Gmail, QuickBooks, workbook, or other private operational data.
- Use synthetic fixtures only.
- Never add credentials, tokens, private keys, OAuth material, or local machine paths.
- Do not modify .github/workflows/jespersen-codex-executor.yml, scripts/agent_precommit_gate.py, scripts/validate_codex_task.py, AGENTS.md, DATA_BOUNDARY.md, or .codex/config.toml.
- Preserve production as out of scope.
- Implement the smallest complete change that satisfies the task acceptance criteria.
- Run relevant tests/checks and repair failures.
- Do not commit, push, open a pull request, or merge. The trusted workflow performs Git operations after the safety gate.
- If the requested task conflicts with repository contracts or needs T3 authority, make no unsafe change and explain the blocker in your final message.
"""
          pathlib.Path("/tmp/jespersen-codex-prompt.md").write_text(prompt)
          PY

      - name: Run Codex implementation
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: /tmp/jespersen-codex-prompt.md
          effort: high

      - name: Enforce public-repository safety gate
        run: |
          set -euo pipefail
          python scripts/agent_precommit_gate.py
          git diff --check

      - name: Detect implementation changes
        id: changed
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push bounded change
        if: steps.changed.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch_name }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          git config user.name "Jespersen Codex Executor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          python scripts/agent_precommit_gate.py --cached
          git commit -m "Agent implementation for issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"

      - name: Open pull request
        id: pr
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch_name }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Agent: issue #${ISSUE_NUMBER}" \
            --body "Autonomous bounded implementation for #${ISSUE_NUMBER}. Public-repo safety gate passed. Independent review is required before merge.")"
          number="${url##*/}"
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Implementation PR opened: $url. Independent QA is running."

      - name: Record no-change result
        if: steps.changed.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Codex completed the bounded task but produced no repository change. Review the workflow run for the executor result."

  review:
    needs: implement
    if: needs.implement.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.implement.outputs.branch_name }}
          fetch-depth: 0

      - name: Fetch trusted main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run trusted safety gate from main
        run: |
          set -euo pipefail
          git show origin/main:scripts/agent_precommit_gate.py > /tmp/agent_precommit_gate.py
          python /tmp/agent_precommit_gate.py --base origin/main --head HEAD
          git diff --check origin/main...HEAD

      - name: Require Codex credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${OPENAI_API_KEY:-}" ] || { echo "OPENAI_API_KEY missing" >&2; exit 1; }

      - name: Build independent review prompt
        env:
          ISSUE_NUMBER: ${{ needs.implement.outputs.issue_number }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
        run: |
          python - <<'PY'
          import os, pathlib
          prompt = f"""You are the independent QA/Security reviewer for Jespersen Painting Intelligence.

Review pull request #{os.environ['PR_NUMBER']} implementing issue #{os.environ['ISSUE_NUMBER']}.

Read AGENTS.md, DATA_BOUNDARY.md, ACCEPTANCE.md, CONSTRAINTS.md, RUNBOOK.md, and the complete diff from origin/main...HEAD.

You are not the implementer. Do not modify files.

Required checks:
- task acceptance criteria are actually satisfied by the diff;
- no real Jespersen/private/customer/employee/payroll/Gmail/QuickBooks/workbook/invoice data is present;
- no secrets or credentials are present;
- production remains out of scope;
- no auth/permissions/domains/DNS/money/pricing/destructive/T3 behavior was added;
- implementation is bounded and reversible;
- tests/validation are appropriate for the change;
- no safety/control-plane file was modified;
- no material unsupported completion claim.

Return the first line exactly as one of:
VERDICT: PASS
VERDICT: FAIL

Then give concise evidence and required remediation if FAIL.
"""
          pathlib.Path("/tmp/jespersen-codex-review.md").write_text(prompt)
          PY

      - name: Run independent Codex review
        id: review
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: /tmp/jespersen-codex-review.md
          output-file: /tmp/jespersen-codex-review.txt
          effort: high

      - name: Parse independent verdict
        id: verdict
        run: |
          set -euo pipefail
          first="$(head -n 1 /tmp/jespersen-codex-review.txt | tr -d '\r')"
          case "$first" in
            "VERDICT: PASS") echo "pass=true" >> "$GITHUB_OUTPUT" ;;
            "VERDICT: FAIL") echo "pass=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Invalid independent verdict: $first" >&2; exit 1 ;;
          esac

      - name: Comment independent review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/jespersen-codex-review.txt

      - name: Merge independently accepted change
        if: steps.verdict.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.implement.outputs.issue_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Independent QA passed and the bounded change was merged to main."

      - name: Leave failed review open
        if: steps.verdict.outputs.pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.implement.outputs.issue_number }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Independent QA failed for PR #$PR_NUMBER. The PR remains unmerged and requires remediation."
