name: Jespersen Mission Controller

on:
  workflow_dispatch:
  repository_dispatch:
    types: [jespersen_executor_complete, jespersen_executor_failed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: jespersen-mission-controller
  cancel-in-progress: false

jobs:
  select-next:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && (github.event.action == 'jespersen_executor_complete' || github.event.action == 'jespersen_executor_failed')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Stop if an executor task is already open
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title [AGENT]' --json number --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Build runtime task ledger
        if: steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'in:title [AGENT]' --limit 200 \
            --json number,title,state,stateReason,createdAt,closedAt,url > /tmp/agent-issues.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 200 \
            --json number,title,state,mergedAt,url > /tmp/agent-prs.json
          python scripts/build_task_ledger.py BACKLOG.md TASK_GRAPH.json /tmp/agent-issues.json /tmp/agent-prs.json > /tmp/task-ledger.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/task-ledger.json"))
          print("Eligible tasks:", ", ".join(p.get("eligibleTaskIds") or []) or "none")
          PY

      - name: Require Perplexity credential
        if: steps.active.outputs.count == '0'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${PERPLEXITY_API_KEY:-}" ] || { echo "PERPLEXITY_API_KEY GitHub Actions secret is not configured." >&2; exit 1; }

      - name: Build controller prompt
        if: steps.active.outputs.count == '0'
        run: |
          cat > /tmp/mission-controller.md <<'PROMPT'
          You are the Jespersen Mission Controller.

          Read PROJECT.md, PRODUCT_SPEC.md, ACCEPTANCE.md, CONSTRAINTS.md, DATA_BOUNDARY.md, UI_STANDARD.md, AGENTS.md, RUNBOOK.md, STATUS.md, BACKLOG.md, TASK_GRAPH.json, DECISIONS.md, FOUNDER_ACTIONS.md, and AUTONOMY_EXECUTOR.md.

          The runtime task ledger appended below is the routing source of truth. BACKLOG.md and STATUS.md remain descriptive project records, but they must not cause you to reselect a task that the runtime ledger marks QA, PASS, BLOCKED, or IN_PROGRESS.

          Select exactly one highest-value unblocked repository coding task that:
          - is explicitly present in BACKLOG.md;
          - has state TODO and eligible=true in the runtime task ledger;
          - has all dependencies satisfied in the runtime task ledger;
          - has not already completed a merged [AGENT] attempt;
          - has not already ended in a terminal failed attempt;
          - is T0 or T1 only;
          - can be completed using public repository context and synthetic fixtures;
          - does not require credentials, private Jespersen data, QuickBooks/Gmail row data, Hedy private payloads, production promotion, auth/permission changes, money/pricing, contracts, domains/DNS, destructive action, or other T3 authority;
          - advances an acceptance criterion;
          - has a concrete rollback;
          - if the task affects any user-facing surface, its requested_work/acceptance/constraints must explicitly inherit UI_STANDARD.md / UI-STD-1.0 and declare the required design assignment: Product, Surface, Dominant Visual Archetype, Secondary Influence, Palette, Density, Motion Intensity, Primary Users, and Critical Information.

          Do not select a task whose acceptance requires live Hedy/provider evidence if the repository-only coding part cannot be independently completed first.
          Do not select protected control-plane work. If an unfinished requirement needs .github/, safety-gate, validator, agent-contract, or other protected-path changes, leave it for the governed control-plane lane and choose another eligible task.
          Never invent a new backlog task ID to work around the ledger.

          If no eligible task exists, return action=stop.

          Return JSON only with these keys:
          action, task_id, permission_tier, environment, objective, requested_work, acceptance, constraints, rollback.

          action must be "dispatch" or "stop".
          permission_tier must be "T0" or "T1".
          environment must be "dev" or "staging".
          Never include real Jespersen data or secrets.

          Runtime task ledger:
          PROMPT
          cat /tmp/task-ledger.json >> /tmp/mission-controller.md

      - name: Run Mission Controller
        if: steps.active.outputs.count == '0'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MODEL: "${{ vars.PERPLEXITY_CONTROLLER_MODEL || 'openai/gpt-6-luna' }}"
        run: |
          set -euo pipefail
          python scripts/perplexity_repo_agent.py             --mode controller             --prompt-file /tmp/mission-controller.md             --output-file /tmp/controller-plan.json             --model "$MODEL"             --service-tier flex             --max-output-tokens 3000

      - name: Validate controller plan
        if: steps.active.outputs.count == '0'
        id: validate
        run: |
          set -euo pipefail
          python scripts/validate_controller_plan.py /tmp/controller-plan.json BACKLOG.md /tmp/task-ledger.json
          action="$(python -c 'import json; print(json.load(open("/tmp/controller-plan.json"))["action"])')"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Create bounded agent task
        id: create_task
        if: steps.active.outputs.count == '0' && steps.validate.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/issue-body.md
          import json
          p=json.load(open("/tmp/controller-plan.json"))
          print(f"""Task ID: {p['task_id']}
          Client context: jespersen-painting
          Permission tier: {p['permission_tier']}
          Environment: {p['environment']}
          Public-safe task package: yes

          Objective:
          {p['objective']}

          Requested work:
          {p['requested_work']}

          Acceptance:
          {p['acceptance']}

          Constraints:
          {p['constraints']}

          Rollback:
          {p['rollback']}
          """)
          PY
          task_id="$(python -c 'import json; print(json.load(open("/tmp/controller-plan.json"))["task_id"])')"
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "[AGENT] $task_id" --body-file /tmp/issue-body.md)"
          issue_number="${issue_url##*/}"
          [[ "$issue_number" =~ ^[0-9]+$ ]] || { echo "Could not resolve created issue number: $issue_url" >&2; exit 1; }
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch bounded executor
        if: steps.active.outputs.count == '0' && steps.validate.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.create_task.outputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid created issue number" >&2; exit 1; }
          gh workflow run jespersen-perplexity-executor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f issue_number="$ISSUE_NUMBER"

      - name: Record stop
        if: steps.active.outputs.count == '0' && steps.validate.outputs.action == 'stop'
        run: echo "No eligible public-safe T0/T1 repository task is currently available."
